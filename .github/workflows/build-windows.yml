name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Privacy scan
        run: python scripts/privacy_scan.py
      - name: Full pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not network"

  build:
    needs: [validate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt
          pip install -r requirements-dev.txt
      - name: Build onefile EXE (no bundled Chromium)
        run: |
          python -m PyInstaller --noconfirm --clean packaging/Jobhuntsaver.spec
          if (!(Test-Path "dist\Jobhuntsaver.exe")) {
            Write-Error "Onefile EXE missing at dist\Jobhuntsaver.exe"
            exit 1
          }
          $item = Get-Item "dist\Jobhuntsaver.exe"
          if ($item.Length -lt 1000000) { Write-Error "EXE too small"; exit 1 }
          $hash = (Get-FileHash "dist\Jobhuntsaver.exe" -Algorithm SHA256).Hash
          @"
          commit=$env:GITHUB_SHA
          size=$($item.Length)
          sha256=$hash
          console=false
          "@ | Set-Content dist\build_metadata.txt
          Get-Item "dist\Jobhuntsaver.exe" | Format-List FullName, Length
          # Fail if this is a console subsystem EXE (users must not see a terminal).
          $bytes = [System.IO.File]::ReadAllBytes("dist\Jobhuntsaver.exe")
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          # 2 = WINDOWS_GUI, 3 = WINDOWS_CUI
          if ($subsystem -ne 2) { Write-Error "EXE subsystem=$subsystem (expected 2=WINDOWS_GUI / noconsole)"; exit 1 }
          Write-Host "EXE subsystem=WINDOWS_GUI (noconsole) OK"
        shell: pwsh
      - name: EXE smoke-test
        shell: pwsh
        run: |
          $tmp = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\jhs-rel-$([guid]::NewGuid())"
          $env:QT_QPA_PLATFORM = "offscreen"
          & ".\scripts\ci_wait_exe_smoke.ps1" -ExePath (Resolve-Path "dist\Jobhuntsaver.exe") -LocalAppData $tmp.FullName
      - name: Upload Jobhuntsaver.exe
        uses: actions/upload-artifact@v4
        with:
          name: Jobhuntsaver-Windows
          path: |
            dist/Jobhuntsaver.exe
            dist/build_metadata.txt
          if-no-files-found: error
          retention-days: 30
