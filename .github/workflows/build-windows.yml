name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Privacy scan
        run: python scripts/privacy_scan.py

      - name: Build onefile EXE (no bundled Chromium)
        run: |
          python -m PyInstaller --noconfirm --clean packaging/Jobhuntsaver.spec
          if (!(Test-Path "dist\Jobhuntsaver.exe")) {
            Write-Error "Onefile EXE missing at dist\Jobhuntsaver.exe"
            exit 1
          }
          Get-Item "dist\Jobhuntsaver.exe" | Format-List FullName, Length
        shell: pwsh

      - name: Upload Jobhuntsaver.exe
        uses: actions/upload-artifact@v4
        with:
          name: Jobhuntsaver-Windows
          path: dist/Jobhuntsaver.exe
          if-no-files-found: error
          retention-days: 14
